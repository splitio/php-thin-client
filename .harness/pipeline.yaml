pipeline:
  name: php-thin-client
  identifier: phpthinclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: php-thin-client
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install PHP
                  identifier: Install_PHP
                  spec:
                    shell: Bash
                    command: |-
                      apt-get update -qq
                      apt-get install -y -qq re2c libcurl4-openssl-dev libonig-dev libzip-dev libsodium-dev libwebp-dev libxml2-dev libssl-dev libgd-dev libjpeg-dev libpng-dev libfreetype-dev libxpm-dev
                      curl https://mise.run | sh
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      mise use --global php@<+matrix.phpVersion>
                      php -v
                      phpize -v || true
              - step:
                  type: Run
                  name: Install Extensions
                  identifier: Install_Extensions
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      pecl install pcov
                      SCAN_DIR=$(php -i | grep '^Scan this dir for additional .ini files' | awk -F'=> ' '{print $2}' | xargs)
                      mkdir -p "$SCAN_DIR"
                      echo "extension=pcov.so" > "$SCAN_DIR/pcov.ini"
                      php -m
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      composer install --prefer-dist
                      composer update
              - step:
                  type: Run
                  name: Print Socket Buffer Sizes
                  identifier: Print_Socket_Buffer_Sizes
                  spec:
                    shell: Sh
                    command: |-
                      sysctl net.core.rmem_max net.core.wmem_max 2>/dev/null || true
                      sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem 2>/dev/null || true
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    envVariables:
                      DEBUG: "true"
                      GHA: "true"
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      make test
              - step:
                  type: Run
                  name: Extract Version
                  identifier: Extract_Version
                  spec:
                    shell: Bash
                    command: |-
                      VERSION=$(grep -Eo "[0-9]+\.[0-9]+\.[0-9]+" src/Version.php | head -1)
                      echo "Extracted VERSION=${VERSION}"
                      echo "VERSION=${VERSION}" >> $HARNESS_ENV_VARS_FILE || true
        strategy:
          matrix:
            phpVersion:
              - "8.1"
              - "8.4"
